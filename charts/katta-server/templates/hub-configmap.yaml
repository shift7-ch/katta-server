apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "katta-server.fullname" . }}-config-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
data:
  HUB_KEYCLOAK_PUBLIC_URL: {{ .Values.urls.kc.public | quote }}
  HUB_KEYCLOAK_LOCAL_URL: {{ include "katta-server.keycloakLocalUrl" . | quote }}
  HUB_KEYCLOAK_REALM: {{ .Values.hub.config.keycloakRealm | quote }}
  HUB_KEYCLOAK_SYSTEM_CLIENT_ID: "cryptomatorhub-system"
  HUB_KEYCLOAK_SYNCER_PERIOD: {{ .Values.hub.config.keycloakSyncerPeriod | quote }}
  HUB_KEYCLOAK_OIDC_CRYPTOMATOR_CLIENT_ID: "cryptomator"
  HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_ID: "cryptomatorvaults"
  {{- if .Values.hub.license.chain.requiredCn }}
  HUB_LICENSE_CHAIN_REQUIRED_CN: {{ .Values.hub.license.chain.requiredCn | quote }}
  {{- end }}
  {{- if and .Values.hub.license.managedApi.username .Values.hub.license.managedApi.password }}
  HUB_MANAGED_API_USERNAME: {{ .Values.hub.license.managedApi.username | quote }}
  HUB_MANAGED_API_PASSWORD: {{ .Values.hub.license.managedApi.password | quote }}
  {{- end }}
  QUARKUS_OIDC_AUTH_SERVER_URL: {{ include "katta-server.oidcAuthServerUrl" . | quote }}
  QUARKUS_OIDC_TOKEN_ISSUER: {{ include "katta-server.oidcTokenIssuer" . | quote }}
  QUARKUS_OIDC_CLIENT_ID: {{ .Values.hub.oidc.clientId | quote }}
  QUARKUS_DATASOURCE_JDBC_URL: {{ include "katta-server.hubJdbcUrl" . | quote }}
  QUARKUS_DATASOURCE_USERNAME: {{ .Values.hub.database.username | quote }}
  QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
  # Quarkus property `quarkus.http.header."Content-Security-Policy".value`; each `."` and
  # `".` in the property name becomes a pair of `_` in the env-var name (Quarkus convention).
  QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: {{ include "katta-server.contentSecurityPolicy" . | quote }}
  # `quarkus.management.enabled` is a build-time property; the published Katta image is
  # built without it, so health (/q/health/*) and metrics (/q/metrics) live on the main
  # HTTP port. Don't try to set QUARKUS_MANAGEMENT_* here — Quarkus rejects the override.
  QUARKUS_MICROMETER_EXPORT_PROMETHEUS_ENABLED: {{ .Values.hub.metrics.enabled | quote }}
