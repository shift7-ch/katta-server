{{- if eq .Values.ingress.controller "contour" }}
{{- $hubHost := regexReplaceAll "^https?://([^:/]+).*" (required "urls.hub.public must be set" .Values.urls.hub.public) "${1}" -}}
{{- $kcHost := regexReplaceAll "^https?://([^:/]+).*" (required "urls.kc.public must be set" .Values.urls.kc.public) "${1}" }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ include "katta-server.fullname" . }}-proxy-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ $hubHost | quote }}
    {{- if .Values.ingress.tls.enabled }}
    tls:
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
    {{- end }}
  routes:
    {{- if .Values.hub.metrics.enabled }}
    - conditions:
        - prefix: "/q/metrics"
      services:
        - name: {{ include "katta-server.fullname" . }}-service-hub
          port: {{ .Values.hub.service.port }}
    {{- end }}
    - conditions:
        - prefix: "/"
      services:
        - name: {{ include "katta-server.fullname" . }}-service-hub
          port: {{ .Values.hub.service.port }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ include "katta-server.fullname" . }}-proxy-kc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ $kcHost | quote }}
    {{- if .Values.ingress.tls.enabled }}
    tls:
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
    {{- end }}
  routes:
    - conditions:
        - prefix: "/"
      services:
        - name: {{ include "katta-server.fullname" . }}-service-kc
          port: {{ .Values.keycloak.service.httpPort }}
{{- end }}
{{- if and .Values.minio.enabled .Values.urls.s3.public }}
{{- $s3Host := regexReplaceAll "^https?://([^:/]+).*" .Values.urls.s3.public "${1}" }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ include "katta-server.fullname" . }}-proxy-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ $s3Host | quote }}
    {{- if .Values.ingress.tls.enabled }}
    tls:
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
    {{- end }}
  routes:
    - conditions:
        - prefix: "/"
      services:
        - name: {{ include "katta-server.fullname" . }}-service-minio
          port: {{ .Values.minio.service.apiPort }}
{{- end }}
{{- if and .Values.minio.enabled .Values.urls.minio.public }}
{{- $minioHost := regexReplaceAll "^https?://([^:/]+).*" .Values.urls.minio.public "${1}" }}
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ include "katta-server.fullname" . }}-proxy-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ $minioHost | quote }}
    {{- if .Values.ingress.tls.enabled }}
    tls:
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
    {{- end }}
  routes:
    - conditions:
        - prefix: "/"
      services:
        - name: {{ include "katta-server.fullname" . }}-service-minio
          port: {{ .Values.minio.service.consolePort }}
{{- end }}
{{- end }}
