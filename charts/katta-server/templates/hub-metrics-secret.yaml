{{- if .Values.hub.metrics.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "katta-server.fullname" . }}-secrets-hub-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.hub.metrics.username | quote }}
  password: {{ include "katta-server.resolvedHubMetricsPassword" . | quote }}
{{- end }}
