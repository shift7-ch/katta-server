{{- if eq .Values.ingress.controller "traefik" }}
{{- $hubHost := regexReplaceAll "^https?://([^:/]+).*" (required "urls.hub.public must be set" .Values.urls.hub.public) "${1}" -}}
{{- $kcHost := regexReplaceAll "^https?://([^:/]+).*" (required "urls.kc.public must be set" .Values.urls.kc.public) "${1}" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "katta-server.fullname" . }}-ingress-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $hubHost | quote }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "katta-server.fullname" . }}-service-hub
                port:
                  number: {{ .Values.hub.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hubHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
  {{- end }}
{{- if .Values.hub.metrics.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "katta-server.fullname" . }}-metrics-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ include "katta-server.fullname" . }}-secrets-hub-metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "katta-server.fullname" . }}-ingress-hub-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-metrics-auth@kubernetescrd" .Release.Namespace (include "katta-server.fullname" .) | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $hubHost | quote }}
      http:
        paths:
          - path: "/q/metrics"
            pathType: Prefix
            backend:
              service:
                name: {{ include "katta-server.fullname" . }}-service-hub
                port:
                  number: {{ .Values.hub.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hubHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
  {{- end }}
{{- end }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "katta-server.fullname" . }}-ingress-kc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $kcHost | quote }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "katta-server.fullname" . }}-service-kc
                port:
                  number: {{ .Values.keycloak.service.httpPort }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $kcHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
  {{- end }}
{{- end }}
{{- if and .Values.minio.enabled .Values.urls.s3.public }}
{{- $s3Host := regexReplaceAll "^https?://([^:/]+).*" .Values.urls.s3.public "${1}" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "katta-server.fullname" . }}-ingress-s3
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $s3Host | quote }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "katta-server.fullname" . }}-service-minio
                port:
                  number: {{ .Values.minio.service.apiPort }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $s3Host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
  {{- end }}
{{- end }}
{{- if and .Values.minio.enabled .Values.urls.minio.public }}
{{- $minioHost := regexReplaceAll "^https?://([^:/]+).*" .Values.urls.minio.public "${1}" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "katta-server.fullname" . }}-ingress-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "katta-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $minioHost | quote }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "katta-server.fullname" . }}-service-minio
                port:
                  number: {{ .Values.minio.service.consolePort }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $minioHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName | required "ingress.tls.secretName must be set when ingress.tls.enabled=true" }}
  {{- end }}
{{- end }}
{{- end }}
