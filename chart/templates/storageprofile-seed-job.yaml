{{- $staticEnabled := .Values.storageProfileSeed.static.enabled -}}
{{- $stsEnabled := .Values.storageProfileSeed.sts.enabled -}}
{{- $openidEnabled := .Values.minio.openid.enabled -}}
{{- if and .Values.minio.enabled (or $staticEnabled $stsEnabled) }}
{{- if and $stsEnabled (not $openidEnabled) }}
{{- fail "storageProfileSeed.sts.enabled requires minio.openid.enabled: the STS profile needs the role ARNs of MinIO's OIDC providers" }}
{{- end }}
{{- $fullname := include "cryptomator-hub.fullname" . -}}
{{- $hubReadyUrl := printf "http://%s-service-hub:%v/q/health/ready" $fullname .Values.hub.service.managementPort -}}
{{- $hubUrl := printf "http://%s-service-hub:%v" $fullname .Values.hub.service.port -}}
{{- $kcUrl := include "cryptomator-hub.keycloakLocalUrl" . | trimSuffix "/" -}}
{{- $minioInternalUrl := printf "http://%s-service-minio:%v" $fullname (int .Values.minio.service.apiPort) -}}
{{- $oidcConfigUrl := include "katta-server.minioOidcConfigUrl" . -}}
{{- /* The storage-profile address must be the *single* URL that works from both inside
       and outside the cluster (browser/clients vs Hub pod). Pull it from urls.s3.public;
       if blank, fall back to the cluster-internal MinIO Service which only works in-cluster. */ -}}
{{- $s3Url := .Values.urls.s3.public -}}
{{- if not $s3Url -}}{{- $s3Url = $minioInternalUrl -}}{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-storageprofile-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: storageprofile-seed
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "cryptomator-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: storageprofile-seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      {{- if $openidEnabled }}
      # MinIO requires one OIDC provider per Keycloak client (its `azp == ClientID`
      # check is strict). This init container:
      #   1. creates the katta-createbucketpolicy / katta-accessbucketpolicy MinIO
      #      policies from the policies ConfigMap;
      #   2. registers the `cryptomator`, `cryptomatorhub`, and `cryptomatorvaults`
      #      OIDC providers via `mc idp openid add`;
      #   3. waits for each provider's role ARN to appear (the ARN is computed only
      #      after MinIO successfully fetches Keycloak's discovery doc) and writes the
      #      three ARNs to /state/{cryptomator,cryptomatorhub,cryptomatorvaults}-role-arn
      #      for the seed container to read.
      # Runs in the alpine/curl image (already used by wait-for-oidc) and downloads a
      # pinned `mc` release from GitHub: the alpine/minio server image ships no `mc`, and
      # MinIO no longer publishes `minio/mc` images or dl.min.io binaries.
      initContainers:
        # `mc idp openid add` validates config_url server-side, so Keycloak must already be
        # serving its discovery endpoint when setup-minio runs. On a fresh install Keycloak's
        # first-boot realm import can outlast this post-install hook; without this gate the
        # adds fail with "connection refused", get swallowed, and the ARN loop hangs forever.
        # Mirrors the Hub deployment's wait-for-oidc init container.
        - name: wait-for-oidc
          image: alpine/curl:8.17.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux
              until [ "$(curl -sS -o /dev/null -w "%{http_code}" "{{ $oidcConfigUrl }}")" = "200" ]; do
                echo "waiting for OIDC discovery endpoint..."
                sleep 5
              done
        - name: setup-minio
          image: alpine/curl:8.17.0
          imagePullPolicy: IfNotPresent
          env:
            # Last mc release published on GitHub; digests from the release's *.sha256sum assets. Keep in sync with deploy/compose/local/minio/setup.sh.
            - name: MC_VERSION
              value: RELEASE.2025-08-13T08-35-41Z
            - name: MC_SHA256_AMD64
              value: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
            - name: MC_SHA256_ARM64
              value: 14c8c9616cfce4636add161304353244e8de383b2e2752c0e9dad01d4c27c12c
            - name: MINIO_URL
              value: {{ $minioInternalUrl | quote }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets-minio
                  key: minio_root_user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets-minio
                  key: minio_root_password
            - name: OIDC_CONFIG_URL
              value: {{ $oidcConfigUrl | quote }}
            # mc respects HOME for its config dir (~/.mc). The pod runs as a non-root
            # user without a writable home, so point HOME at the writable emptyDir we
            # mount below (the downloaded mc binary lives there too).
            - name: HOME
              value: /state
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # mc writes its config under $HOME/.mc
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              case "$(uname -m)" in
                x86_64)  mc_arch=amd64; mc_sha256="$MC_SHA256_AMD64" ;;
                aarch64) mc_arch=arm64; mc_sha256="$MC_SHA256_ARM64" ;;
                *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              echo "Downloading mc $MC_VERSION ($mc_arch)..."
              curl -fsSL --retry 5 --retry-all-errors -o /state/mc \
                "https://github.com/minio/mc/releases/download/$MC_VERSION/mc.linux-$mc_arch.$MC_VERSION"
              echo "$mc_sha256  /state/mc" | sha256sum -c -
              chmod +x /state/mc
              PATH="/state:$PATH"

              echo "Configuring mc alias for $MINIO_URL..."
              until mc alias set local "$MINIO_URL" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "  MinIO not reachable yet, retrying..."
                sleep 2
              done

              # Extract the first arn:minio:iam:::role/<id> substring from command output
              # using POSIX shell parameter expansion only (no grep/sed/awk dependency).
              extract_arn() {
                output=$("$@" 2>/dev/null || true)
                case "$output" in
                  *"arn:minio:iam:::role/"*)
                    rest="${output#*arn:minio:iam:::role/}"
                    arn_id="${rest%%[!A-Za-z0-9_]*}"
                    if [ -n "$arn_id" ]; then
                      printf '%s' "arn:minio:iam:::role/$arn_id"
                      return 0
                    fi
                    ;;
                esac
                return 1
              }

              # Helper: run an mc command, print stdout+stderr regardless of exit code so
              # we never silently mask "already exists" or actual errors during re-runs.
              # Indents each output line with four spaces using shell builtins only.
              try_mc() {
                _label="$1"; shift
                if output=$("$@" 2>&1); then
                  echo "  [$_label] ok"
                else
                  echo "  [$_label] exit=$? (probably idempotent re-run; continuing)"
                fi
                if [ -n "$output" ]; then
                  printf '%s\n' "$output" | while IFS= read -r line; do
                    printf '    %s\n' "$line"
                  done
                fi
              }

              # If all three providers are already configured and have ARNs, skip the
              # re-setup + restart cycle entirely — the StatefulSet survives helm
              # uninstall/reinstall via its PVC, so on a typical `helm upgrade` MinIO
              # already has the right state and a restart would just cause a brief outage.
              all_present=1
              for name in cryptomator cryptomatorhub cryptomatorvaults; do
                if ! extract_arn mc idp openid info local "$name" >/dev/null 2>&1; then
                  all_present=0
                  break
                fi
              done

              if [ "$all_present" = "1" ]; then
                echo "All three providers already configured with role ARNs; skipping setup."
              else
                echo "Creating MinIO policies..."
                try_mc "policy create katta-createbucketpolicy" \
                  mc admin policy create local katta-createbucketpolicy /policies/create_bucket_policy.json
                try_mc "policy create katta-accessbucketpolicy" \
                  mc admin policy create local katta-accessbucketpolicy /policies/access_bucket_policy.json

                echo "Registering OIDC providers..."
                # Triplets of "<provider-name>:<keycloak-client-id>:<minio-role-policy>".
                # Provider name = Keycloak client_id by convention so `mc idp openid info
                # local <name>` is easy to reason about.
                for entry in \
                  "cryptomator:cryptomator:katta-createbucketpolicy" \
                  "cryptomatorhub:cryptomatorhub:katta-createbucketpolicy" \
                  "cryptomatorvaults:cryptomatorvaults:katta-accessbucketpolicy" \
                ; do
                  name="${entry%%:*}"
                  rest="${entry#*:}"
                  client_id="${rest%%:*}"
                  policy="${rest#*:}"
                  try_mc "idp openid add $name" \
                    mc idp openid add local "$name" \
                      "config_url=$OIDC_CONFIG_URL" \
                      "client_id=$client_id" \
                      "client_secret=ignore-me" \
                      "role_policy=$policy"
                done

                # mc tells us to restart after registering OIDC providers — the role ARN
                # isn't computed until MinIO has reloaded its config. `--json` skips the
                # interactive progress UI that needs /dev/tty (which we don't have here).
                echo "Restarting MinIO to activate the new OIDC providers..."
                mc --json admin service restart local

                echo "Waiting for MinIO to come back..."
                until mc admin info local >/dev/null 2>&1; do
                  echo "  not ready yet, retrying..."
                  sleep 2
                done
                echo "MinIO is back."
              fi

              echo "Discovering role ARN for each provider..."
              # The ARN appears only after MinIO has successfully fetched Keycloak's
              # discovery doc. Keep retrying until both sides of the chain work.
              for name in cryptomator cryptomatorhub cryptomatorvaults; do
                while :; do
                  if arn=$(extract_arn mc idp openid info local "$name"); then
                    printf '%s' "$arn" > "/state/${name}-role-arn"
                    echo "  $name -> $arn"
                    break
                  fi
                  echo "  ARN for $name not ready yet, retrying..."
                  sleep 2
                done
              done
              echo "MinIO setup complete."
          volumeMounts:
            - name: state
              mountPath: /state
            - name: policies
              mountPath: /policies
              readOnly: true
      {{- end }}
      containers:
        - name: seed
          # Image with a shell, so that the access token obtained with `katta accesstoken`
          # can be passed to `katta storageprofile`.
          image: "{{ .Values.storageProfileSeed.image.repository }}:{{ .Values.storageProfileSeed.image.tag }}"
          imagePullPolicy: {{ .Values.storageProfileSeed.image.pullPolicy }}
          env:
            - name: HUB_READY_URL
              value: {{ $hubReadyUrl | quote }}
            - name: HUB_URL
              value: {{ $hubUrl | quote }}
            - name: KEYCLOAK_URL
              value: {{ $kcUrl | quote }}
            - name: REALM
              value: {{ .Values.hub.config.keycloakRealm | quote }}
            - name: HUB_READY_TIMEOUT
              value: {{ .Values.storageProfileSeed.hubReadyTimeoutSeconds | quote }}
            - name: S3_URL
              value: {{ $s3Url | quote }}
            - name: SYSTEM_CLIENT_ID
              value: "cryptomatorhub-system"
            - name: SYSTEM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-secrets-hub
                  key: hub_system_client_secret
            {{- if $staticEnabled }}
            - name: STATIC_PROFILE_NAME
              value: {{ .Values.storageProfileSeed.static.profileName | quote }}
            - name: STATIC_BUCKET_PREFIX
              value: {{ .Values.storageProfileSeed.static.bucketPrefix | quote }}
            {{- end }}
            {{- if $stsEnabled }}
            - name: STS_PROFILE_NAME
              value: {{ .Values.storageProfileSeed.sts.profileName | quote }}
            - name: STS_BUCKET_PREFIX
              value: {{ .Values.storageProfileSeed.sts.bucketPrefix | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          # the -shell image (distroless debug) has its shell at /busybox/sh, not /bin/sh
          command: ["/busybox/sh", "-eu", "-c"]
          args:
            - |
              echo "Waiting for Hub at $HUB_READY_URL (timeout ${HUB_READY_TIMEOUT}s)..."
              deadline=$(( $(date +%s) + HUB_READY_TIMEOUT ))
              while :; do
                if wget -q -O /dev/null "$HUB_READY_URL"; then
                  echo "Hub is ready."
                  break
                fi
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "Hub did not become ready within ${HUB_READY_TIMEOUT}s" >&2
                  exit 1
                fi
                sleep 2
              done

              echo "Requesting admin token from Keycloak..."
              ACCESS_TOKEN=$(katta accesstoken \
                --tokenUrl "$KEYCLOAK_URL/realms/$REALM/protocol/openid-connect/token" \
                --clientId "$SYSTEM_CLIENT_ID" \
                --clientSecret "$SYSTEM_CLIENT_SECRET")
              echo "Got access token."

              # --skipIfExists makes the upload idempotent: the Hub assigns a new id for every
              # POST, so without it every run of this post-install/post-upgrade hook would add
              # another copy of the storage profile. An existing profile is not updated.
              {{- if $staticEnabled }}

              katta storageprofile s3 static \
                --hubUrl "$HUB_URL" \
                --accessToken "$ACCESS_TOKEN" \
                --name "$STATIC_PROFILE_NAME" \
                --endpointUrl "$S3_URL" \
                --bucketPrefix "$STATIC_BUCKET_PREFIX" \
                --region us-east-1 \
                --skipIfExists
              {{- end }}
              {{- if $stsEnabled }}

              # Each role ARN belongs to a DIFFERENT MinIO OIDC provider, written by the
              # setup-minio init container:
              #   - cryptomator       = bucket creation by the desktop app
              #   - cryptomatorhub    = bucket creation by the SPA
              #   - cryptomatorvaults = vault access
              katta storageprofile minio sts \
                --hubUrl "$HUB_URL" \
                --accessToken "$ACCESS_TOKEN" \
                --name "$STS_PROFILE_NAME" \
                --endpointUrl "$S3_URL" \
                --bucketPrefix "$STS_BUCKET_PREFIX" \
                --region us-east-1 \
                --stsRoleCreateBucketClient "$(cat /state/cryptomator-role-arn)" \
                --stsRoleCreateBucketHub "$(cat /state/cryptomatorhub-role-arn)" \
                --stsRoleAccessBucket "$(cat /state/cryptomatorvaults-role-arn)" \
                --skipIfExists
              {{- end }}

              echo "Done."

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $stsEnabled }}
            - name: state
              mountPath: /state
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if or $stsEnabled $openidEnabled }}
        - name: state
          emptyDir: {}
        {{- end }}
        {{- if $openidEnabled }}
        - name: policies
          configMap:
            name: {{ $fullname }}-minio-policies
        {{- end }}
{{- end }}
