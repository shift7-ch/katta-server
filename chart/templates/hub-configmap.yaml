apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}-config-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
data:
  HUB_PUBLIC_ROOT_PATH: {{ include "cryptomator-hub.hubRelativePath" . | trimSuffix "/" | printf "%s/" | quote }}
  HUB_KEYCLOAK_PUBLIC_URL: {{ .Values.urls.kc.public | quote }}
  HUB_KEYCLOAK_LOCAL_URL: {{ include "cryptomator-hub.keycloakLocalUrl" . | quote }}
  HUB_KEYCLOAK_REALM: {{ .Values.hub.config.keycloakRealm | quote }}
  HUB_KEYCLOAK_SYSTEM_CLIENT_ID: "cryptomatorhub-system"
  HUB_KEYCLOAK_SYNCER_PERIOD: {{ .Values.hub.config.keycloakSyncerPeriod | quote }}
  HUB_KEYCLOAK_OIDC_CRYPTOMATOR_CLIENT_ID: "cryptomator"
  HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_ID: "cryptomatorvaults"
  {{- if .Values.hub.license.chain.requiredCn }}
  HUB_LICENSE_CHAIN_REQUIRED_CN: {{ .Values.hub.license.chain.requiredCn | quote }}
  {{- end }}
  {{- if and .Values.hub.license.managedApi.username .Values.hub.license.managedApi.password }}
  HUB_MANAGED_API_USERNAME: {{ .Values.hub.license.managedApi.username | quote }}
  HUB_MANAGED_API_PASSWORD: {{ .Values.hub.license.managedApi.password | quote }}
  {{- end }}
  {{- if .Values.hub.license.apiUrl }}
  QUARKUS_REST_CLIENT_LICENSE_API_URL: {{ .Values.hub.license.apiUrl | quote }}
  {{- end }}
  {{- if .Values.urls.billing.public }}
  HUB_BILLING_URL: {{ .Values.urls.billing.public | quote }}
  {{- end }}
  QUARKUS_OIDC_AUTH_SERVER_URL: {{ include "cryptomator-hub.oidcAuthServerUrl" . | quote }}
  QUARKUS_OIDC_TOKEN_ISSUER: {{ include "cryptomator-hub.oidcTokenIssuer" . | quote }}
  QUARKUS_OIDC_CLIENT_ID: {{ .Values.hub.oidc.clientId | quote }}
  QUARKUS_DATASOURCE_JDBC_URL: {{ include "cryptomator-hub.hubJdbcUrl" . | quote }}
  QUARKUS_DATASOURCE_USERNAME: {{ .Values.hub.database.username | quote }}
  QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
  {{- /* Whole Content-Security-Policy header is assembled here and set via the env-var form of `quarkus.http.header."Content-Security-Policy".value`, overriding the image's application.properties default at runtime (no image rebuild). The browser must reach Keycloak's OIDC endpoints; when Keycloak is on a different origin than Hub (subdomain routing) that origin must be in connect-src. Origin only (scheme://host:port); a CSP source with a path would match only that exact path. */}}
  {{- $additionalConnectSrc := regexReplaceAll "^(https?://[^/]+).*" (required "urls.kc.public must be set" .Values.urls.kc.public) "${1}" }}
  {{- /* / katta start addition */}}
  {{- /* Katta license API plus AWS S3/STS endpoints, mirroring the image default in application.properties. */}}
  {{- $additionalConnectSrc = printf "%s %s" $additionalConnectSrc "api.katta.cloud" }}
  {{- if and .Values.minio.enabled .Values.urls.s3.public }}
  {{- /* The SPA uploads/downloads encrypted blobs straight to the S3 endpoint from the browser, so its origin must be in connect-src. */}}
  {{- $additionalConnectSrc = printf "%s %s" $additionalConnectSrc (regexReplaceAll "^(https?://[^/]+).*" .Values.urls.s3.public "${1}") }}
  {{- end }}
  {{- /* Storage profiles the browser talks to directly (S3 and STS endpoints of external providers)
         are not known to the chart, so their sources are configured explicitly. Entries are CSP
         source expressions and are used verbatim, which allows host wildcards such as
         `https://*.wasabisys.com` covering both path-style and virtual-hosted-style requests. */}}
  {{- range .Values.hub.config.additionalConnectSrc | default list }}
  {{- $additionalConnectSrc = printf "%s %s" $additionalConnectSrc . }}
  {{- end }}
  {{- /* \ katta end addition */}}
  {{- $csp := .Values.hub.config.contentSecurityPolicy | default (printf "default-src 'self'; connect-src 'self' %s; object-src 'none'; child-src 'self'; img-src * data:; frame-ancestors 'none'" $additionalConnectSrc) }}
  QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: {{ $csp | quote }}
  QUARKUS_MANAGEMENT_ENABLED: "true"
  QUARKUS_MANAGEMENT_HOST: "0.0.0.0"
  QUARKUS_MANAGEMENT_PORT: "9000"
  QUARKUS_SMALLRYE_HEALTH_MANAGEMENT_ENABLED: "true"
  QUARKUS_OTEL_SDK_DISABLED: {{ not .Values.hub.metrics.enabled | quote }}
  {{- if .Values.hub.metrics.enabled }}
  QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.hub.metrics.endpoint | required "hub.metrics.endpoint must be set when hub.metrics.enabled=true" | quote }}
  QUARKUS_OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.hub.metrics.protocol | required "hub.metrics.protocol must be set when hub.metrics.enabled=true" | quote }}
  {{- $attrs := dict "service.name" (include "cryptomator-hub.fullname" .) "service.version" .Chart.AppVersion -}}
  {{- range $k, $v := .Values.hub.metrics.resourceAttributes }}{{- $_ := set $attrs $k $v }}{{- end }}
  {{- $pairs := list }}
  {{- range $k := keys $attrs | sortAlpha }}{{- $pairs = append $pairs (printf "%s=%v" $k (index $attrs $k)) }}{{- end }}
  QUARKUS_OTEL_RESOURCE_ATTRIBUTES: {{ join "," $pairs | quote }}
  {{- end }}
