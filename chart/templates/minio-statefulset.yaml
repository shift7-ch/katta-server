{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cryptomator-hub.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cryptomator-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  serviceName: {{ include "cryptomator-hub.fullname" . }}-service-minio
  selector:
    matchLabels:
      {{- include "cryptomator-hub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "cryptomator-hub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
      annotations:
        checksum/minio-secret: {{ include (print $.Template.BasePath "/minio-secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          # MinIO no longer publishes container images (docker.io/minio/minio deleted, quay.io/minio/minio requires auth since 2026-09),
          # see https://github.com/shift7-ch/katta-compose/issues/22. alpine/minio is a community rebuild of the last community
          # release, not an official artifact, hence the default is pinned by multi-arch index digest.
          image: "docker.io/alpine/minio:{{ .Values.minio.image.tag | default "RELEASE.2025-10-15T17-29-55Z@sha256:cf23643a6cf9ce159c57643ceb88279e431262282428c9e0bf3a7ef1a97e84b4" }}"
          imagePullPolicy: {{ .Values.minio.imagePullPolicy }}
          args:
            - server
            - /data
            - --address
            - ":{{ .Values.minio.service.apiPort }}"
            - --console-address
            - ":{{ .Values.minio.service.consolePort }}"
          ports:
            - name: api
              containerPort: {{ .Values.minio.service.apiPort }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.minio.service.consolePort }}
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-minio
                  key: minio_root_user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cryptomator-hub.fullname" . }}-secrets-minio
                  key: minio_root_password
            {{- if .Values.urls.minio.public }}
            # Lets the MinIO Console emit its public URL in HTML/redirects instead of the
            # in-pod hostname (so links don't break when accessed through the ingress).
            - name: MINIO_BROWSER_REDIRECT_URL
              value: {{ trimSuffix "/" .Values.urls.minio.public | quote }}
            {{- end }}
            # NOTE: OIDC providers are NOT configured via MINIO_IDENTITY_OPENID_* env vars.
            # Those env vars only configure a single (default-named) provider, and MinIO's
            # strict `azp == ClientID` check means we need one provider per Keycloak client.
            # The seed Job's `setup-minio` init container runs `mc idp openid add` for
            # `cryptomator`, `cryptomatorhub`, and `cryptomatorvaults` and creates the
            # `katta_create_bucket_policy` / `katta_access_bucket_policy` policies.
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cryptomator-hub.labels" . | nindent 10 }}
          app.kubernetes.io/component: minio
      spec:
        accessModes:
          - {{ .Values.minio.storage.accessMode }}
        {{- if .Values.minio.storage.storageClassName }}
        storageClassName: {{ .Values.minio.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.storage.size | quote }}
{{- end }}
