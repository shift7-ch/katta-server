# Demo values: full stack on a local cluster with nginx ingress, including bundled MinIO
# and a pre-seeded S3STATIC storage profile. Not intended for production.
#
# Every public URL is `*.localhost:9090`. macOS + every modern browser resolves
# *.localhost to 127.0.0.1 (no /etc/hosts edits needed). From inside Hub/MinIO pods,
# hostAliases (configured automatically) point those names at a chart-managed proxy
# Service that forwards :9090 to the nginx-ingress-controller on its native port 80.
# So the same URL works from the browser and from any pod, on a single non-privileged
# port — no sudo, no /etc/hosts.
#
# Deploy:
#   minikube addons enable ingress           # one-off
#   helm install katta charts/cryptomator-hub \
#     --namespace katta --create-namespace \
#     -f charts/cryptomator-hub/values-demo.yaml
#
# Port-forward — leave running in a separate terminal:
#   kubectl port-forward -n ingress-nginx svc/ingress-nginx-controller 9090:80
#
# After install, in your browser:
#   - Hub UI:          http://hub.localhost:9090       (admin / admin)
#   - Keycloak admin:  http://kc.localhost:9090        (admin / admin)
#   - MinIO console:   http://minio.localhost:9090     (minioadmin / minioadmin)
#   - MinIO S3 API:    http://s3.localhost:9090        (used by the seeded storage profile)

urls:
  hub:
    public: "http://hub.localhost:9090"
  kc:
    public: "http://kc.localhost:9090"
  minio:
    public: "http://minio.localhost:9090"
  s3:
    public: "http://s3.localhost:9090"

ingress:
  controller: "nginx"
  className: "nginx"
  proxy:
    # Pin the port-translation proxy's ClusterIP so hostAliases on Hub/MinIO pods are
    # populated on the FIRST `helm install` (without a pin, the IP is only discoverable
    # after the Service is created, so pod-to-pod routing breaks until the next upgrade).
    # If this IP collides with something in your cluster, pick another free address in
    # the Service CIDR (minikube default: 10.96.0.0/12).
    clusterIP: "10.96.250.250"

hub:
  admin:
    username: admin
    password: admin
    passwordTemporary: false
  metrics:
    enabled: false

keycloak:
  admin:
    username: admin
    password: admin

minio:
  enabled: true
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  storage:
    size: 1Gi
  # Wire MinIO up with Keycloak for AssumeRoleWithWebIdentity; the seed Job below
  # discovers the resulting role ARN and registers an S3STS profile against it.
  openid:
    enabled: true

storageProfileSeed:
  static:
    enabled: true
  sts:
    enabled: true
