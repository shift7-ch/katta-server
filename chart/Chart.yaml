apiVersion: v2
name: katta-server
home: https://github.com/shift7-ch/katta-server
icon: https://cryptomator.org/img/logo.png
description: Helm chart for deploying Katta Server (downstream fork of Cryptomator Hub) with optional Keycloak, PostgreSQL and MinIO
type: application
version: "1.0.0"
appVersion: "2d939d8"
kubeVersion: ">=1.27.0-0"
sources:
  - https://github.com/shift7-ch/katta-server
keywords:
  - katta
  - katta-server
annotations:
  # Rancher catalog metadata, see https://ranchermanager.docs.rancher.com/how-to-guides/new-user-guides/helm-charts-in-rancher/create-apps
  catalog.cattle.io/display-name: Katta Server
  catalog.cattle.io/kube-version: ">=1.27.0-0"
  catalog.cattle.io/os: linux
  # sum of the default resource requests of hub + keycloak + postgres (see values.yaml)
  catalog.cattle.io/requests-cpu: 450m
  catalog.cattle.io/requests-memory: 640Mi
