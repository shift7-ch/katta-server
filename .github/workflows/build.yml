name: CI Build

on:
  push:
  pull_request_target:
    types: [labeled]

env:
  NODE_VERSION: 26
  JAVA_VERSION: 25

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout
    # gate for dependabot issue, see https://github.com/cryptomator/hub/pull/459
    if: ${{ !(startsWith(github.head_ref, 'dependabot/npm_and_yarn/') || startsWith(github.ref_name, 'dependabot/npm_and_yarn/')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - name: Check lockfile integrity
        working-directory: frontend
        run: bash scripts/check-lockfile.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build and test frontend
        working-directory: frontend
        run: pnpm run test:coverage
      - name: Deploy frontend
        working-directory: frontend
        run: pnpm run dist
      # / katta start commented out
      #- name: SonarCloud Scan Frontend
      #  uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
      #  with:
      #    projectBaseDir: frontend
      #    args: >
      #      -Dsonar.organization=cryptomator
      #      -Dsonar.projectKey=cryptomator_hub_frontend
      #      -Dsonar.typescript.tsconfigPath=tsconfig.json
      #      -Dsonar.sources=src/
      #      -Dsonar.tests=test/
      #      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # \ katta start commented out
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      # / katta start commented out
      #- name: Cache SonarCloud packages
      #  uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      #  with:
      #    path: ~/.sonar/cache
      #    key: ${{ runner.os }}-sonar
      #    restore-keys: ${{ runner.os }}-sonar
      # \ katta start commented out
      - name: Build and test backend
        working-directory: backend
        run: >
          ./mvnw -B clean verify
          # / katta start commented out
          #          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          #          -Dsonar.projectKey=cryptomator_hub_backend
          #          -Dsonar.organization=cryptomator
          #          -Dsonar.host.url=https://sonarcloud.io
          # \ katta start commented out
          --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-native-image:
    name: Build and Push ${{ matrix.arch }} Image
    needs: test
    # / katta start commented out - build every commit
    # if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build image]')
    # \ katta end commented out
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    outputs:
      digest_amd64: ${{ steps.digest.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.digest.outputs.digest_arm64 }}
    permissions:
      contents: read # Required for checkout
      packages: write # Required for pushing the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - name: Check lockfile integrity
        working-directory: frontend
        run: bash scripts/check-lockfile.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      # / katta addition
      - id: get_tag
        name: get tag
        working-directory: backend
        run: |
          if [[ ! -z "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ ${{ github.ref_type }} == 'tag' ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ ${{ github.ref_name  }} == ${{ github.event.repository.default_branch }} ]]; then
            TAG=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          else
            TAG="commit-${{ github.sha }}"
          fi
          echo tag=${TAG}
          echo tag=${TAG} >> "$GITHUB_OUTPUT"
        # \ katta addition
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Deploy frontend
        working-directory: frontend
        run: pnpm run dist
      - name: Ensure to use tagged version
        working-directory: backend
        # / katta modification
        #run: ./mvnw versions:set --file pom.xml -DnewVersion=${GITHUB_REF##*/}
        run: ./mvnw versions:set --file pom.xml -DnewVersion=${{ steps.get_tag.outputs.tag }}
        # \ katta modification
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/shift7-ch/katta-server
          # / katta modification
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ steps.get_tag.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
          # \ katta modification
          flavor: |
            suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Katta Server
            org.opencontainers.image.vendor=Shift 7 GmbH
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Container Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/src/main/docker/Dockerfile.native
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
      - name: Export Digest
        id: digest
        run: |
          echo "digest_${{ matrix.arch }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"



  multi-arch-image:
    name: Build and Push Multi-Arch Image
    needs: build-native-image
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    permissions:
      contents: read # Required for checkout
      id-token: write # Required for the attestations step
      attestations: write # Required for the attestations step
      artifact-metadata: write # Required for the attestations step
      packages: write # Required for pushing the image to GHCR
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Determine versions
        id: version
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            # Tag names can contain shell metacharacters and these values flow into later `run:` interpolations,
            # so allow only OCI-tag-safe characters and fail fast otherwise.
            if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Refusing unsafe version '${version}' derived from tag '${GITHUB_REF_NAME}' (allowed: [0-9A-Za-z._-])" >&2
              exit 1
            fi
            app_version="$version"
            chart_version="$version"
          else
            app_version="$short_sha"
            chart_version="0.0.0-${short_sha}"
          fi
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Multi-Arch Manifest for ghcr.io/shift7-ch/katta-server:${{ steps.version.outputs.app_version }}
        run: >
          docker buildx imagetools create
          --tag "ghcr.io/shift7-ch/katta-server:${{ steps.version.outputs.app_version }}"
          --tag "ghcr.io/shift7-ch/katta-server:${{ steps.version.outputs.short_sha }}"
          ${{ github.ref_name == github.event.repository.default_branch && '--tag "ghcr.io/shift7-ch/katta-server:latest"' || '' }}
          "ghcr.io/shift7-ch/katta-server@${{ needs.build-native-image.outputs.digest_amd64 }}"
          "ghcr.io/shift7-ch/katta-server@${{ needs.build-native-image.outputs.digest_arm64 }}"
      - name: Retrieve Multi-Arch Digest
        id: inspect
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/shift7-ch/katta-server:${{ steps.version.outputs.app_version }} --format "{{json .Manifest}}" | jq -r .digest)
          echo "digest_multiarch=${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/shift7-ch/katta-server
          subject-digest: ${{ steps.inspect.outputs.digest_multiarch }}
          push-to-registry: true

# / katta start addition
  keycloak-integrationtests:
    name: Run katta Keycloak Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'
      - name: Run Keycloak integration tests
        working-directory: keycloak
        run: >
          mvn -B clean verify
# \ katta end addition

  publish-helm-chart:
    name: Publish Helm Chart
    needs: multi-arch-image
    uses: ./.github/workflows/helm-chart.yml
    with:
      appVersion: ${{ needs.multi-arch-image.outputs.app_version }}
      version: ${{ needs.multi-arch-image.outputs.chart_version }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    secrets: inherit
