# Cryptomator Hub stack for local testing. Uses katta.yaml, minio/ and ../../../chart, so run it from a checkout of this repository:
#
#   docker compose up
#
# Hub:      http://localhost:8280  (realm user `admin` / `admin`, test license with 5 seats)
# Keycloak: http://localhost:8380  (bootstrap admin `admin` / `admin`)
#
# NOT FOR PRODUCTION: well-known passwords, plain HTTP, all services on localhost. See README.md in this directory for details.
#
# To change ports, the realm or its credentials, set the variables listed in .env.template, e.g. in a .env file next to this one. Note that browsers grant a secure
# context (required by Hub's client-side crypto) to `localhost` only — any other hostname needs TLS, see ../prod/compose.yaml.
# / start katta extension
include:
  - path: katta.yaml
# \ end katta extension
services:

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
    configs:
      - source: create-keycloak-db
        target: /docker-entrypoint-initdb.d/create-keycloak-db.sql
    volumes:
      # postgres >= 18 keeps PGDATA in /var/lib/postgresql/<major>/docker, so the volume is mounted one level up
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: ghcr.io/shift7-ch/keycloak:26.8.1
    command: start --optimized --import-realm
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      # issuer/discovery URLs advertise the browser-facing origin; Hub's backchannel requests via http://keycloak:8080 still work:
      KC_HOSTNAME: http://localhost:${HUB_KEYCLOAK_HTTP_PORT:-8380}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY: "false"
    ports:
      - "${HUB_KEYCLOAK_HTTP_PORT:-8380}:8080"  # katta: 8180 is taken by quarkus:dev
    # / start katta extension
    volumes:
      # imported on first boot only; `--import-realm` never overwrites an existing realm (run `docker compose down -v` to start over)
      - keycloak-import:/opt/keycloak/data/import:ro
    # \ end katta extension
    depends_on:
      postgres:
        condition: service_healthy
      # / start katta extension
      keycloak-realm:
        condition: service_completed_successfully
      # \ end katta extension
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  hub:
    image: ${KATTA_SERVER_IMAGE:-ghcr.io/shift7-ch/katta-server:latest}
    environment:
      HUB_PUBLIC_ROOT_PATH: /
      HUB_KEYCLOAK_PUBLIC_URL: http://localhost:${HUB_KEYCLOAK_HTTP_PORT:-8380}
      HUB_KEYCLOAK_LOCAL_URL: http://keycloak:8080
      HUB_KEYCLOAK_REALM: ${HUB_KEYCLOAK_REALM:-cryptomator}
      HUB_KEYCLOAK_SYSTEM_CLIENT_ID: cryptomatorhub-system
      HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET: ${HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET:-top-secret}
      HUB_KEYCLOAK_SYNCER_PERIOD: 1m
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/${HUB_KEYCLOAK_REALM:-cryptomator}
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:${HUB_KEYCLOAK_HTTP_PORT:-8380}/realms/${HUB_KEYCLOAK_REALM:-cryptomator}
      QUARKUS_OIDC_CLIENT_ID: cryptomatorhub
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/hub
      QUARKUS_DATASOURCE_USERNAME: hub
      QUARKUS_DATASOURCE_PASSWORD: hub
      # the image's default CSP only allows same-origin connections, but the SPA must reach Keycloak's OIDC endpoints on localhost:8380 and MinIO on minio.localhost:9100:
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'; connect-src 'self' api.cryptomator.org api.katta.cloud localhost:${HUB_KEYCLOAK_HTTP_PORT:-8380} ${MINIO_HOSTNAME:-minio.localhost}:${MINIO_PORT:-9100} ${CSP_CONNECT_SRC_EXTRA:-}; object-src 'none'; child-src 'self'; img-src * data:; frame-ancestors 'none'"
      QUARKUS_OTEL_SDK_DISABLED: "true"
      # / start katta extension
      HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_SECRET: ${HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_SECRET:-top-secret}
      # public test license with 5 seats
      HUB_INITIAL_ID: ${HUB_INITIAL_ID:-42}
      HUB_INITIAL_LICENSE: ${HUB_INITIAL_LICENSE:-..AZrb7lULe-bvea6LyFsTq7dZZBozgXuqEnr8M5nua-3KyM6gZw_hygBVkmAZw-u4NMlG8u0GEpKlK9rmLUPOpF36AaTa3h9WCQIzmiqn30Rm_zRd9T3WrmWXjkmWKnv7YpfufZI_zT-lpcKGasGm1w3YVWu_nSa9gQd_0Pm1r3QSQWTX}
      HUB_LICENSE_CHAIN_REQUIRED_CN: ${HUB_LICENSE_CHAIN_REQUIRED_CN:-Hub License Issuer CA (Test)}
      # \ end katta extension
    ports:
      - "${HUB_PORT:-8280}:8080"  # katta: 8080 is taken by quarkus:dev
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

configs:
  # Hub and Keycloak share the postgres instance but use separate databases:
  create-keycloak-db:
    content: |
      CREATE USER keycloak WITH PASSWORD 'keycloak';
      CREATE DATABASE keycloak OWNER keycloak;

  # / start katta extension
  # Katta renders the realm from chart/templates/_realm.tpl (`keycloak-realm` service in katta.yaml). Port upstream changes of the
  # `cryptomator-realm` config to that template.
  # \ end katta extension

volumes:
  postgres-data:
