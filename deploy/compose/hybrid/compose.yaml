# Katta Server and PostgreSQL on this machine, connected to a Keycloak (and storage) that already runs elsewhere:
#
#   cp .env.template .env   # then fill in the values
#   docker compose up
#
# Katta: http://localhost:8280. See README.md in this directory for what the external Keycloak needs.
services:

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
    volumes:
      # postgres >= 18 keeps PGDATA in /var/lib/postgresql/<major>/docker, so the volume is mounted one level up
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 12

  hub:
    image: ${KATTA_SERVER_IMAGE:-ghcr.io/shift7-ch/katta-server:latest}
    environment:
      HUB_PUBLIC_ROOT_PATH: /
      HUB_KEYCLOAK_PUBLIC_URL: ${HUB_KEYCLOAK_PUBLIC_URL}
      HUB_KEYCLOAK_LOCAL_URL: ${HUB_KEYCLOAK_LOCAL_URL:-${HUB_KEYCLOAK_PUBLIC_URL}}
      HUB_KEYCLOAK_REALM: ${HUB_KEYCLOAK_REALM}
      HUB_KEYCLOAK_SYSTEM_CLIENT_ID: cryptomatorhub-system
      HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET: ${HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET}
      HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_SECRET: ${HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_SECRET}
      HUB_KEYCLOAK_SYNCER_PERIOD: 1m
      QUARKUS_OIDC_AUTH_SERVER_URL: ${HUB_KEYCLOAK_LOCAL_URL:-${HUB_KEYCLOAK_PUBLIC_URL}}/realms/${HUB_KEYCLOAK_REALM}
      QUARKUS_OIDC_TOKEN_ISSUER: ${HUB_KEYCLOAK_PUBLIC_URL}/realms/${HUB_KEYCLOAK_REALM}
      QUARKUS_OIDC_CLIENT_ID: cryptomatorhub
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/hub
      QUARKUS_DATASOURCE_USERNAME: hub
      QUARKUS_DATASOURCE_PASSWORD: hub
      # the SPA must reach Keycloak's OIDC endpoints and the S3/STS endpoints of the storage profiles (CSP_CONNECT_SRC_EXTRA)
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'; connect-src 'self' api.cryptomator.org api.katta.cloud ${HUB_KEYCLOAK_PUBLIC_URL} ${CSP_CONNECT_SRC_EXTRA:-}; object-src 'none'; child-src 'self'; img-src * data:; frame-ancestors 'none'"
      QUARKUS_OTEL_SDK_DISABLED: "true"
      HUB_INITIAL_ID: ${HUB_INITIAL_ID:-}
      HUB_INITIAL_LICENSE: ${HUB_INITIAL_LICENSE:-}
      HUB_LICENSE_CHAIN_REQUIRED_CN: ${HUB_LICENSE_CHAIN_REQUIRED_CN:-Hub License Issuer CA (Prod)}
    ports:
      - "8280:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
